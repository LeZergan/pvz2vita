name: Source checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: mkdir -p out
      - run: python scripts/prepare-livearea.py
      - run: python scripts/check-touch-render.py
      - run: python scripts/check-program-cache.py
      - run: python scripts/check-program-binding.py
      - run: python scripts/check-shader-pairs.py
      - run: python scripts/check-async-reports.py
      - run: python scripts/check-config-store.py
      - run: python scripts/check-jni-unicode.py
      - run: python scripts/check-placement.py
      - run: python scripts/check-worker-affinity.py
      - run: python scripts/check-pixel-workers.py
      - run: python scripts/check-texture-units.py
      - run: python scripts/check-time-bridge.py
      - run: python scripts/check-filesystem-bridge.py
      - run: python scripts/check-deadlines.py
      - run: python scripts/check-stall-watch.py
      - run: python scripts/check-thread-bridge.py
      - run: python scripts/check-thread-attributes.py
      - run: python scripts/check-import-resolver.py
